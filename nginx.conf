server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # model/gltf-binary: the meshopt-compressed models are laid out to
    # shrink a further ~20-40 % under gzip (tools/optimize-models.mjs)
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml
               model/gltf-binary model/gltf+json text/plain;

    # This site has no build step and no hashed filenames — any file can
    # change on any deploy, so NOTHING may be served stale for a day.
    # "no-cache" still lets the browser cache, but it revalidates with
    # the ETag/Last-Modified nginx sends, so unchanged files cost a 304
    # and changed files go live on the visitor's next reload. (Serving
    # JS with max-age=86400 previously paired a cached old module with
    # fresh HTML and broke the site after an update.)
    add_header Cache-Control "no-cache";

    # the contact postcard: relay to the Node mailer sidecar (compose
    # service "mailer"). The upstream hostname sits in a variable and is
    # resolved through Docker's embedded DNS at request time, so nginx
    # still boots while the mailer container restarts. And
    # client_max_body_size must cover the upload — nginx's 1 MB default
    # swallows attachments whole.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mailer_upstream http://mailer:8081;
        proxy_pass $mailer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 3D model files (GLB tower loads via model-viewer / three.js)
    location ~* \.(glb|gltf)$ {
        types {
            model/gltf-binary glb;
            model/gltf+json  gltf;
        }
        # add_header above is NOT inherited once this block has its own,
        # so restate the cache policy alongside Accept-Ranges
        add_header Cache-Control "no-cache";
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    # the model credits (linked from the footer) read in the browser
    location ~* \.md$ {
        default_type text/plain;
        charset utf-8;
        types { }
        try_files $uri =404;
    }
}
